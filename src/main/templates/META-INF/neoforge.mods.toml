modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ProstoCheI/JEI-Unhidden/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ProstoCheI/JEI-Unhidden"
logoFile="jei_unhidden.png"
authors="ProstoCheI"
description='''
Every registered item, visible.

Shows items that other mods omit from creative tabs or remove from JEI's item list.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="required"
versionRange="[19.27.0.340,20)"
ordering="AFTER"
side="CLIENT"
